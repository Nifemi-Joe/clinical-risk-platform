name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check src/ tests/ api/ scripts/

      - name: Run tests
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t clinical-risk-api:ci .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t clinical-risk-frontend:ci .
        # Note: this job validates the Dockerfiles build successfully on a
        # real GitHub Actions runner (which has Docker available) - the
        # sandbox this project was built in did not have Docker, so this CI
        # job is the actual first verification of both images building. Push
        # steps to a registry are intentionally omitted - add them with your
        # own registry credentials as secrets before relying on this for
        # real deployment.
