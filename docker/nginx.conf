server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: any path that isn't a real file falls back
    # to index.html so React Router handles it (otherwise /dashboard etc.
    # would 404 on a hard refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-host deployment (docker-compose): proxy /api to the backend
    # service. Not used if VITE_API_URL was set to a full URL at build time
    # for a split-host deployment (frontend and backend on different domains).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Long-cache hashed assets; never cache index.html itself.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
